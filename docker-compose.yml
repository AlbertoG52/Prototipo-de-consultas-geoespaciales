services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data     # persistencia: los datos sobreviven aunque se apague el contenedor
    ports:
      - "5432:5432"                          # opcional: solo para inspeccionar la BD con pgAdmin/DBeaver
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./Backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./Backend:/app                       # monta el código: editás en tu máquina y se refleja en el contenedor
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy           # el backend arranca solo cuando la BD está lista
    command: sh entrypoint.sh

  frontend:
    build: ./Frontend
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
  frontend_node_modules:
