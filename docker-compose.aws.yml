# Modo AWS: conecta el backend al PostgreSQL de la EC2 en lugar del local. Se aplica encima
# de docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml up --build
#
# Requiere, antes, el túnel SSH abierto en otra terminal (ver certs/README.md):
#
#   ssh -i certs/llave-aws.pem -N -L 5433:localhost:5432 USUARIO_EC2@IP_EC2
#
# Requisitos:
#   - túnel SSH abierto
#   - DATABASE_URL_AWS definida en el .env
#   - Docker Compose 2.24.4 o superior (por el "!reset" de abajo)

services:
  db:
    # El PostgreSQL local no se levanta en este modo.
    profiles: ["solo-local"]

  backend:
    environment:
      # Reemplaza la URL del contenedor "db". Si falta la variable, Compose se detiene con
      # este mensaje.
      DATABASE_URL: ${DATABASE_URL_AWS:?Falta DATABASE_URL_AWS}
    # Garantiza host.docker.internal también en Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Ya no hay que esperar al Postgres local.
    depends_on: !reset {}
