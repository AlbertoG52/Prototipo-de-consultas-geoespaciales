# Modo AWS: conecta el backend a la base de datos Postgres que corre en la EC2
# de AWS, en vez del Postgres local. NO reemplaza a docker-compose.yml, se
# aplica encima:
#
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml up --build
#
# La conexión pasa por un túnel SSH que se abre ANTES, en otra terminal, con la
# llave .pem (detalle en certs/README.md):
#
#   ssh -i certs/llave-aws.pem -N -L 5433:localhost:5432 USUARIO_EC2@IP_EC2
#
# El túnel expone la base de la EC2 en el puerto 5433 de tu máquina, y el
# contenedor llega a tu máquina por el nombre host.docker.internal.
#
# Requisitos:
#   - túnel SSH abierto
#   - DATABASE_URL_AWS definida en el .env
#   - Docker Compose 2.24.4 o superior (por el "!reset" de abajo)
#
# Uso previsto: demos e integración desde main. El desarrollo diario sigue
# siendo local con "docker compose up".

services:
  db:
    # El Postgres local no se levanta en este modo. Solo arrancaría si alguien
    # pide explícitamente el perfil "solo-local".
    profiles: ["solo-local"]

  backend:
    environment:
      # Reemplaza la URL que apunta al contenedor "db". Si falta la variable,
      # Compose se detiene con este mensaje en lugar de arrancar a medias.
      DATABASE_URL: ${DATABASE_URL_AWS:?Falta DATABASE_URL_AWS}
    # Docker Desktop ya resuelve host.docker.internal; esta línea lo garantiza
    # también en Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Ya no hay que esperar al Postgres local.
    depends_on: !reset {}
